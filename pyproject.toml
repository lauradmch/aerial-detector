[project]
name = "aerial-detector"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Laura", email = "llaura.domenech@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "scikit-learn>=1.9.0",
    "ultralytics>=8.4.121",
]

[project.scripts]
aerial-detector = "aerial_detector:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_detector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# E,F = erreurs pycodestyle/pyflakes ; I = import order ; N = naming
# UP = pyupgrade ; B = bugbear (patterns risqués) ; SIM = simplify